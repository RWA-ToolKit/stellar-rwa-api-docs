name: Documentation Feature Request
about: Suggest new documentation or improvements to existing docs
labels: ["documentation", "enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a documentation improvement! Please describe your idea below.
  - type: textarea
    id: problem
    attributes:
      label: What is missing or unclear?
      description: Describe the gap in the current documentation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed documentation
      description: What would you like to see added or changed?
    validations:
      required: true
  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Links, examples, or related issues.
    validations:
      required: false
