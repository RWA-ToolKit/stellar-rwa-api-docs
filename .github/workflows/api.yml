name: API

on:
  push:
    paths:
      - "api/**"
      - ".github/workflows/api.yml"
  pull_request:
    paths:
      - "api/**"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: api
      # Tests and clippy run before the formatting gate. `cargo fmt --check`
      # used to be the first step, so 59 cosmetic violations aborted the job
      # before anything was compiled — hiding a test suite that had not built
      # for weeks. Formatting is still enforced, just no longer as a mask.
      - name: Test
        run: cargo test
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Format check
        run: cargo fmt --check
      - name: Build (release)
        run: cargo build --release

  cargo-deny:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v5
      - name: cargo-deny check (advisories + licenses)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: api/Cargo.toml
          command: check advisories licenses
