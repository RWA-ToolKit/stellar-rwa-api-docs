name: API

on:
  push:
    paths:
      - "api/**"
      - ".github/workflows/api.yml"
  pull_request:
    paths:
      - "api/**"
  schedule:
    # Daily, opt-in check against the live testnet RPC endpoint — separate
    # from the push/PR job so a flaky or down testnet never blocks merges.
    - cron: "0 6 * * *"
  workflow_dispatch: {}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: api
      # Tests and clippy run before the formatting gate. `cargo fmt --check`
      # used to be the first step, so 59 cosmetic violations aborted the job
      # before anything was compiled — hiding a test suite that had not built
      # for weeks. Formatting is still enforced, just no longer as a mask.
      - name: Test
        run: cargo test
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Format check
        run: cargo fmt --check
      - name: Build (release)
        run: cargo build --release
      - name: Build with locked lockfile
        run: cargo build --locked

  testnet-integration:
    # Opt-in only: never runs on push/PR, only on the daily schedule or a
    # manual dispatch. Hits the real Soroban testnet RPC, so it's expected
    # to be flakier than the fixture-backed suite above.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: api
      - name: Testnet integration tests
        id: testnet
        continue-on-error: true
        env:
          RUN_TESTNET_TESTS: "1"
        run: |
          set -o pipefail
          cargo test --test testnet_integration -- --ignored 2>&1 | tee testnet-integration.log
      - name: Preserve Testnet diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testnet-integration-${{ github.run_id }}
          path: api/testnet-integration.log
          if-no-files-found: warn
          retention-days: 14
      - name: Summarise Testnet drift
        if: always()
        uses: actions/github-script@v7
        env:
          TESTNET_OUTCOME: ${{ steps.testnet.outcome }}
        with:
          script: |
            const failed = process.env.TESTNET_OUTCOME === 'failure';
            const { owner, repo } = context.repo;
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: 'api.yml',
              event: 'schedule',
              status: 'completed',
              per_page: 10,
            });
            const priorRuns = data.workflow_runs
              .filter((run) => run.id !== context.runId)
              .slice(0, 3);
            const priorFailures = priorRuns.filter((run) => run.conclusion === 'failure').length;
            const persistent = failed && priorFailures > 0;
            const diagnosis = failed
              ? persistent
                ? 'Persistent drift: at least one recent scheduled Testnet run also failed.'
                : 'Transient blip candidate: no recent scheduled failure was found.'
              : 'No Testnet drift detected.';

            await core.summary
              .addHeading('Daily Testnet integration report')
              .addTable([
                [{ data: 'Signal', header: true }, { data: 'Result', header: true }],
                ['Current run', failed ? 'drift detected' : 'healthy'],
                ['Classification', persistent ? 'persistent drift' : failed ? 'transient blip candidate' : 'healthy'],
                ['Recent scheduled failures', `${priorFailures}/${priorRuns.length}`],
                ['Diagnostics', 'Download the testnet-integration artifact and inspect the failing RPC assertion.'],
              ])
              .addRaw(`\n${diagnosis}\n`)
              .write();

            if (failed) {
              core.warning(`${diagnosis} Testnet integration is observational and does not block merges; inspect the uploaded diagnostics artifact.`);
            }
