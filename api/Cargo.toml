[package]
name = "stellar-rwa-api"
version = "0.1.0"
edition = "2021"
description = "REST API indexing tokenized real-world asset activity on Stellar."
license = "Apache-2.0"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "limit", "timeout", "trace"] }
tower_governor = "0.5"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arc-swap = "1"
stellar-xdr = { version = "23", default-features = false, features = ["curr", "std", "base64"] }
stellar-strkey = "0.0.13"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
metrics = "0.24"
metrics-exporter-prometheus = "0.16"
rand = "0.9"
url = "2"
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }

[dev-dependencies]
tower = { version = "0.4", features = ["util"] }
http-body-util = "0.1"

[dev-dependencies]
insta = { version = "1", features = ["json"] }
serde_json = "1"

[[bin]]
name = "stellar-rwa-api"
path = "src/main.rs"
